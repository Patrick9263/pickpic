<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2E2E2E"/>
    </linearGradient>
    <clipPath id="photoWindow"><rect x="304" y="244" width="416" height="360" rx="10"/></clipPath>
  </defs>

  <!-- Grayscale source. iOS maps luminance onto the user's chosen tint, so the
       shapes are separated by brightness alone - no hue does any work here. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 512) rotate(-8) translate(-512 -512)">
    <rect x="272" y="212" width="480" height="560" rx="28" fill="#B4B4B4"/>
    <g clip-path="url(#photoWindow)">
      <rect x="304" y="244" width="416" height="360" fill="#4F4F4F"/>
      <circle cx="620" cy="304" r="34" fill="#FFFFFF"/>
      <path d="M264 620 L452 392 L566 506 L648 424 L760 560 L760 620 Z" fill="#8A8A8A"/>
    </g>
    <!-- heart is the brightest value in the icon; dark ring holds it off the card -->
    <path d="M700 790 C700 790 604 736 604 682 C604 646 636 622 668 622 C684 622 694 630 700 640 C706 630 716 622 732 622 C764 622 796 646 796 682 C796 736 700 790 700 790 Z"
          fill="none" stroke="#3D3D3D" stroke-width="46" stroke-linejoin="round"/>
    <path d="M700 790 C700 790 604 736 604 682 C604 646 636 622 668 622 C684 622 694 630 700 640 C706 630 716 622 732 622 C764 622 796 646 796 682 C796 736 700 790 700 790 Z"
          fill="#FFFFFF"/>
  </g>
</svg>
