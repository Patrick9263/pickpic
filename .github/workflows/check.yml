name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  ipad-build:
    name: Verify iPad app builds
    if: github.event_name == 'pull_request'
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Top-level `paths:` filters gate the whole workflow, but `check` above must
      # still run for every PR — so gate this job at the step level instead, by
      # diffing against the PR's actual base/head SHAs (stable under force-pushes,
      # unlike branch names) rather than relying on a shallow default checkout.
      - name: Check for ipad/ changes
        id: filter
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^ipad/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iPad app
        if: steps.filter.outputs.changed == 'true'
        run: |
          set -o pipefail
          xcodebuild -project ipad/PickPic.xcodeproj -scheme PickPic -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/pickpic-build clean build \
            | grep -E "error:|warning:|BUILD"

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Prevent two main-branch deployments from running at the same time.
    # A newer pending deployment can safely replace an older pending one
    # because main contains all previously merged commits.
    concurrency:
      group: pickpic-production
      cancel-in-progress: false

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Deploy public site
        run: npm run deploy

      - name: Deploy admin site
        run: npm run deploy:admin

      - name: Deploy app site
        run: npm run deploy:app
