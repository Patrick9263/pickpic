name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Lint shell scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Set up fake home for scripts/review/run-review.sh
        # run-review.sh hardcodes REPO=/Users/patrick/Dev/pickpic and
        # STATE_DIR=/Users/patrick/.claude/pickpic-review -- it's a personal, locally-scheduled job,
        # not general-purpose software, so the bats suite exercises the real script by making those
        # exact paths resolve on this disposable runner rather than by changing its behavior.
        run: |
          sudo mkdir -p /Users/patrick/Dev
          sudo chown -R "$(id -u):$(id -g)" /Users/patrick
          ln -sfn "$GITHUB_WORKSPACE" /Users/patrick/Dev/pickpic

      - name: Run scripts/review bats tests
        run: bats scripts/review/tests

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  # Top-level `paths:` filters gate the whole workflow, but `check` above must
  # still run for every PR — so decide here, on a cheap Ubuntu runner, whether
  # the macOS job below is needed at all. Gating that job's steps instead would
  # make every PR wait for an `xcode-27` runner just to run this diff, and that
  # image's capacity is thin enough that a job has gone unacquired for 15
  # minutes and been cancelled. Diff the PR's actual base/head SHAs (stable
  # under force-pushes, unlike branch names) from their merge base, so commits
  # that landed on `main` after the PR branched don't count as its changes.
  ipad-changes:
    name: Detect iPad changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for iPad or workflow changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if grep -Eq '^(ipad/|\.github/workflows/check\.yml$)' <<< "$CHANGED"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  ipad-build:
    name: Verify iPad app builds
    needs: ipad-changes
    # A skipped job satisfies a required status check, and a job whose `needs`
    # failed is skipped by default — so without `!cancelled()` a broken change
    # detector would quietly pass this check. Instead, run the full build
    # whenever detection didn't succeed, and skip only on a clean "no changes".
    if: >-
      github.event_name == 'pull_request' && !cancelled() &&
      (needs.ipad-changes.result != 'success' || needs.ipad-changes.outputs.changed == 'true')
    # `macos-latest` carries no Xcode 27, so the build used to skip with a
    # warning. `xcode-27` is GitHub's dedicated hosted image for it (see
    # actions/runner-images); it is not a self-hosted runner.
    runs-on: xcode-27

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Use the dedicated image's stable default rather than picking a newer
      # beta from /Applications. Missing prerequisites fail an eligible check.
      - name: Verify the default Xcode supports the deployment target
        id: xcode
        run: |
          TARGET=$(sed -nE 's/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = ([0-9.]+);/\1/p' ipad/PickPic.xcodeproj/project.pbxproj | sort -V | tail -1)
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          xcodebuild -version
          echo "iOS Simulator SDK $SDK; deployment target $TARGET"
          if [ -z "$TARGET" ] || [ "$(printf '%s\n%s\n' "$TARGET" "$SDK" | sort -V | head -1)" != "$TARGET" ]; then
            echo "::error::The default Xcode simulator SDK does not meet the PickPic deployment target."
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"

      - name: Build iPad app
        run: |
          set -o pipefail
          xcodebuild -project ipad/PickPic.xcodeproj -scheme PickPic -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/pickpic-build clean build \
            | grep -E "error:|warning:|BUILD"

      # `xcodebuild test` needs a concrete simulator, unlike the generic
      # destination the build step above uses -- and which iPad simulators
      # ship on a runner's image varies by Xcode version, so pick whichever
      # one is actually available rather than hardcoding a model name that
      # could disappear from a future runner image and silently break CI.
      - name: Find an available iPad simulator
        id: simulator
        env:
          TARGET: ${{ steps.xcode.outputs.target }}
          SDK: ${{ steps.xcode.outputs.sdk }}
        run: |
          if ! SIMULATOR=$(xcrun simctl list devices available -j | jq -ce --arg target "$TARGET" --arg sdk "$SDK" '
            def version: split(".") | map(tonumber) | (. + [0, 0])[:3];
            [.devices | to_entries[]
              # Take only the leading numeric version: the image also carries
              # runtimes like iOS-27-1-iPhone19..., which `tonumber` rejects.
              | (.key | capture("\\.iOS-(?<v>[0-9]+(?:-[0-9]+)*)") | .v | gsub("-"; ".")) as $runtime
              | select(($runtime | version) >= ($target | version) and ($runtime | version) <= ($sdk | version))
              | .value[] | select(.name | startswith("iPad"))
              | {name, udid, runtime: $runtime}]
            | sort_by(.runtime | version) | last'); then
            echo "::error::No available iPad simulator between iOS $TARGET and SDK $SDK."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $(jq -r '.name + " (iOS " + .runtime + ")"' <<< "$SIMULATOR")"
          echo "udid=$(jq -r '.udid' <<< "$SIMULATOR")" >> "$GITHUB_OUTPUT"

      # Swift Testing reports a failing expectation as "✘ Test foo() recorded
      # an issue at File.swift:…", which carries neither "error:" nor "Suite" —
      # match it explicitly, or a red run shows which suite failed but not why.
      - name: Run PickPicTests
        run: |
          set -o pipefail
          xcodebuild test -project ipad/PickPic.xcodeproj -scheme PickPic -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath /tmp/pickpic-build \
            2>&1 | grep -E "error:|Test Suite|Suite .* (started|passed|failed)|recorded an issue|TEST SUCCEEDED|TEST FAILED"

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Prevent two main-branch deployments from running at the same time.
    # A newer pending deployment can safely replace an older pending one
    # because main contains all previously merged commits.
    concurrency:
      group: pickpic-production
      cancel-in-progress: false

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Deploy public site
        run: npm run deploy

      - name: Deploy admin site
        run: npm run deploy:admin

      - name: Deploy app site
        run: npm run deploy:app
